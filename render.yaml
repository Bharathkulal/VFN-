services:
  - type: web
    name: vfn-tournament-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_NAME
        value: sportbid_vfn
      - key: MONGODB_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        value: admin@vfn.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_FULL_NAME
        value: Tournament Admin
      - key: CLOUDINARY_CLOUD_NAME
        value: wcajcjoc
      - key: CLOUDINARY_API_KEY
        value: "822824153389891"
      - key: CLOUDINARY_API_SECRET
        sync: false
